[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-ads-mcp"
version = "0.2.1"
description = "OAuth-enabled Meta Ads MCP with guarded paused mutations"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<51",
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "psycopg[binary]>=3,<4",
  "requests>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
meta-ads-mcp = "meta_ads_mcp.server:main"
meta-ads-mcp-admin = "meta_ads_mcp.admin:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_ads_mcp"]
